name: Refrescar canales verificados

on:
  schedule:
    - cron: "0 5 * * 1"   # cada lunes
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/build_channels.py
      - name: Commit si cambia
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add channels.json
          git diff --cached --quiet || (git commit -m "Actualizar channels.json" && git push)
